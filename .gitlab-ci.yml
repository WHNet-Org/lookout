stages: [verify, package, deploy, release]

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'

default:
  image: node:24-bookworm

verify:
  stage: verify
  interruptible: true
  variables:
    GIT_DEPTH: "0"
  script:
    - node scripts/ci/version.mjs build
    - npm ci
    - npm run verify
  artifacts:
    reports:
      dotenv: .artifacts/ci/version.env

browser:
  stage: verify
  interruptible: true
  script:
    - npm ci
    - npx --no-install playwright-core install --with-deps chromium
    - npm run test:browser

container:
  stage: package
  tags: [linux-amd64-fast]
  image: docker:28-cli
  services: [docker:28-dind]
  variables:
    DOCKER_TLS_CERTDIR: /certs
  resource_group: lookout-images
  dependencies: [verify]
  script:
    - sh scripts/ci/image.sh
  artifacts:
    reports:
      dotenv: .artifacts/ci/image.env

production:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true" && $LOOKOUT_PRODUCTION_READY == "1" && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web")'
  environment:
    name: production
    url: https://$LOOKOUT_DOMAIN
  resource_group: lookout-production
  interruptible: false
  dependencies: []
  script:
    - npm ci
    - npm run deploy

release:
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/ && $CI_COMMIT_REF_PROTECTED == "true"'
  resource_group: lookout-releases
  dependencies: [container]
  script:
    - node scripts/ci/release.mjs
